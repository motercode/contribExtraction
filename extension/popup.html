<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ContribExtraction</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <h1>ContribExtraction</h1>
      <p id="status">Abre Google Maps y luego extrae la pestaña actual.</p>
      <section class="settings" aria-label="Configuración de extracción">
        <label class="setting">
          <span>Máx. elementos</span>
          <select id="max-items"></select>
        </label>
        <label class="setting">
          <span>Pausa entre fotos</span>
          <select id="gallery-item-delay-ms"></select>
        </label>
        <label class="setting">
          <span>Pausa de scroll</span>
          <select id="scroll-step-delay-ms"></select>
        </label>
        <label class="setting">
          <span>Espera de cambio de URL</span>
          <select id="url-change-timeout-ms"></select>
        </label>
        <label class="setting">
          <span>Espera de estabilidad</span>
          <select id="url-stable-timeout-ms"></select>
        </label>
        <label class="setting">
          <span>Pausa tras consentimiento</span>
          <select id="consent-post-click-delay-ms"></select>
        </label>
        <label class="setting">
          <span>Pausa de fallback</span>
          <select id="gallery-fallback-click-delay-ms"></select>
        </label>
      </section>
      <div class="actions">
        <button id="open-maps">Abrir Google Maps</button>
        <button id="capture" class="primary">Extraer desde esta pestaña</button>
      </div>
      <button id="open-json" class="secondary">Abrir JSON</button>
      <section class="harvest" aria-label="Inventario completo del perfil">
        <h2>Inventario completo (fase 1)</h2>
        <p id="harvest-status">Abre la pestaña de fotos de un perfil y pulsa Iniciar.</p>
        <div class="actions">
          <button id="harvest-start" class="primary">Iniciar</button>
          <button id="harvest-stop">Detener</button>
        </div>
      </section>
      <section class="harvest" aria-label="Coordenadas de cada foto">
        <h2>Coordenadas (fase 2)</h2>
        <p id="detail-status">Abre cada foto del inventario y guarda sus coordenadas. Usa las pausas de arriba.</p>
        <div class="actions">
          <button id="detail-start" class="primary">Iniciar / retomar</button>
          <button id="detail-stop">Detener</button>
        </div>
        <button id="detail-open" class="secondary">Abrir resultado</button>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
